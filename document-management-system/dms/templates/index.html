{% extends "base.html" %}
{% block content %}
<div class="card">
 <h3>Upload document</h3>
 <form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
  <input name="title" placeholder="Title (optional)">
  <input name="category" placeholder="Category (e.g. Invoices)" list="cats">
  <datalist id="cats">{% for c in cats %}<option value="{{ c }}">{% endfor %}</datalist>
  <input type="file" name="file" required>
  <button>Upload</button>
 </form>
</div>
<div class="card">
 <form method="get">
  <input name="q" value="{{ q }}" placeholder="Search title or filename">
  <select name="category"><option value="">All categories</option>
   {% for c in cats %}<option {{ 'selected' if c == cat }}>{{ c }}</option>{% endfor %}</select>
  <button>Search</button>
 </form>
 <table>
  <tr><th>Title</th><th>Category</th><th>Size</th><th>Uploaded</th><th></th></tr>
  {% for d in docs %}
  <tr><td>{{ d.title }}<br><small>{{ d.original_name }}</small></td>
   <td>{{ d.category }}</td><td>{{ d.size|filesize }}</td><td>{{ d.uploaded_at }}</td>
   <td><a href="{{ url_for('download', doc_id=d.id) }}">Download</a>
    <form method="post" action="{{ url_for('delete', doc_id=d.id) }}" style="display:inline"
          onsubmit="return confirm('Delete this document?')"><button class="danger">Delete</button></form></td></tr>
  {% else %}<tr><td colspan="5">No documents found.</td></tr>{% endfor %}
 </table>
</div>
{% endblock %}
