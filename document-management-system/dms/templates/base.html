<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "Digital Document Management System" }}</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;color:#222}
 header{background:#1f3a5f;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
 header a{color:#fff;margin-left:16px}
 main{max-width:960px;margin:24px auto;padding:0 16px}
 .card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
 input,button,select{padding:8px;margin:4px 4px 4px 0;font:inherit}
 button{background:#1f3a5f;color:#fff;border:0;border-radius:4px;cursor:pointer}
 button.danger{background:#b3261e}
 table{width:100%;border-collapse:collapse}
 th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}
 .flash{background:#fff3cd;padding:8px 12px;border-radius:4px;margin-bottom:12px}
</style></head><body>
<header><strong>📁 Digital Document Management System</strong>
<nav>{% if session.user_id %}{{ session.username }}<a href="{{ url_for('logout') }}">Logout</a>
{% else %}<a href="{{ url_for('login') }}">Login</a><a href="{{ url_for('register') }}">Register</a>{% endif %}</nav></header>
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</main></body></html>
